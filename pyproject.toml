[project]
# PyPI's "blurt" is taken by an unrelated macOS transcription tool. The import
# package and the `blurt` command are unaffected; only the published name differs.
name = "blurt-stt"
version = "0.1.0"
description = "Linux dictation daemon using a remote WhisperLive / Wyoming faster-whisper server, with optional Ollama cleanup."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jim Vogel" }]
keywords = ["dictation", "speech-to-text", "whisper", "linux", "wayland"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "wyoming>=1.5.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "evdev>=1.7",
    "pystray>=0.19",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/voglster/blurt"
Repository = "https://github.com/voglster/blurt"
Issues = "https://github.com/voglster/blurt/issues"

[project.scripts]
blurt = "blurt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
