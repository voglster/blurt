[project]
name = "blurt"
version = "0.1.0"
description = "Personal Linux dictation daemon using remote Wyoming faster-whisper + Ollama cleanup."
requires-python = ">=3.12"
dependencies = [
    "wyoming>=1.5.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "evdev>=1.7",
    "pystray>=0.19",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
blurt = "blurt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
