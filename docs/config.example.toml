# Copy to ~/.config/blurt/config.toml and edit.

[whisper]
backend = "whisperlive"   # "whisperlive" (streaming) or "wyoming" (batch)
host = "your-stt-host"
port = 9091
model = "deepdml/faster-whisper-large-v3-turbo-ct2"   # ADVISORY if the server pins one via -fw
use_vad = false           # NO-OP: WhisperLive takes VAD as a server launch flag

[stt]
# Biases decoding toward this vocabulary. Costs no extra latency.
initial_prompt = ""
hotwords = ""

[cleanup]
enabled = false           # optional Ollama post-pass
host = "your-ollama-host"
port = 11434
model = "llama3.2:latest"
timeout_ms = 500

# One keyboard: the singular form is still fine.
[hotkey]
keycode = "KEY_CALC"
device = "auto"

# Several keyboards: use [[hotkeys]] instead, one block per key. Pin `device`
# rather than leaving it "auto" when more than one device claims the keycode —
# HID capability lists are over-declared, so "auto" can pick a device that
# advertises the key but never emits it.
# [[hotkeys]]
# keycode = "KEY_MEDIA"
# device = "/dev/input/by-path/platform-i8042-serio-0-event-kbd"
#
# [[hotkeys]]
# keycode = "KEY_CALC"
# device = "/dev/input/by-id/usb-Logitech_USB_Receiver-if02-event-mouse"

[corrections]
file = "~/.config/blurt/corrections.yaml"

[overlay]
position = "center"       # "center", "top-center", or "bottom-center"
monitor = "primary"       # "primary", an output name like "DP-4", or "pointer"
font = "monospace 22"
width_fraction = 0.75
corner_radius = 14        # 0 for square corners

[tray]
enabled = true
