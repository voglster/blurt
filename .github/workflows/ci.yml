name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Ubuntu's system python3.12 has no tkinter (it lives in python3-tk).
      # Importing blurt no longer needs Tk, so this is not about avoiding a
      # crash — it is so the Tk-dependent tests actually run here instead of
      # silently skipping. uv's managed builds bundle tkinter.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - run: uv run --python ${{ matrix.python-version }} ruff check .

      - run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
